if(!res.length)add('estudio','Para explorar otras estrategias, aunque actualmente estés obteniendo buenos resultados.');return res.slice(0,4)}
function graphs(){let groups=scores(),ss=summary();let entries=groups.filter(g=>g.pct!==null);let graph='';if(st.view==='bars')graph=`<div class="viz-bars">${groups.map(g=>`<div><div class="viz-title"><b>${g.label}</b><span>${g.pct===null?'Sin respuestas':g.pct+'%'}</span></div><div class="viz-track"><div style="width:${g.pct||0}%"></div></div></div>`).join('')}</div>`;
if(st.view==='tiles')graph=`<div class="viz-grid">${groups.map(g=>`<div class="viz-tile"><b>${g.label}</b><strong>${g.pct===null?'—':g.pct+'%'}</strong><small>${g.pct===null?'Sin evidencias declaradas':g.pct>=75?'Prácticas para potenciar':g.pct>=45?'Estrategias para consolidar':'Oportunidades para fortalecer'}</small></div>`).join('')}</div>`;
if(st.view==='radar'){let cx=150,cy=145,r=105;const point=(i,v)=>{let a=-Math.PI/2+i*Math.PI/2;return [(cx+Math.cos(a)*r*v).toFixed(2),(cy+Math.sin(a)*r*v).toFixed(2)].join(',')};let lines=[.25,.5,.75,1].map(z=>`<polygon points="${groups.map((_,i)=>point(i,z)).join(' ')}" fill="none" stroke="#ded4f0" />`).join('');let pol=groups.map((g,i)=>point(i,(g.pct||0)/100)).join(' ');graph=`<svg class="radar" viewBox="0 0 300 290" role="img" aria-label="Radar de cuatro ámbitos. Los valores faltantes se muestran como cero solo en este gráfico.">${lines}<polygon points="${pol}" fill="#6e46b455" stroke="#6e46b4" stroke-width="3"/>${groups.map((g,i)=>{let a=-Math.PI/2+i*Math.PI/2,x=cx+Math.cos(a)*128,y=cy+Math.sin(a)*126;return `<text x="${x}" y="${y}" text-anchor="middle" font-size="10" fill="#4b3970">${['Decisiones','Lectura','Comunicación','Autorregulación'][i]}</text>`}).join('')}</svg><p class="footnote">En el radar, los ámbitos sin respuesta no pueden interpretarse; revisa los porcentajes individuales.</p>`}
return `<div class="view-switch">${btn('Visualizar · Barras','view-bars',st.view==='bars'?'green':'secondary')}${btn('Radar','view-radar',st.view==='radar'?'green':'secondary')}${btn('Tarjetas','view-tiles',st.view==='tiles'?'green':'secondary')}</div><div id="chart-zone">${graph}</div><div class="note"><b>Cómo leer el puntaje</b><p>${ss.n?`${ss.total} de ${ss.max} puntos posibles (${ss.pct}%) en ${ss.n} de ${ITEMS.length} prácticas respondidas.`:'Aún no hay prácticas respondidas.'} Cada práctica aporta 0–4 puntos según la frecuencia y seguridad declaradas. No es una nota académica ni una medida validada de competencia. El resultado sirve para orientar la conversación.</p></div>`}
function render(){if(st.step===-1){root.innerHTML=`<section class="hero"><div><span class="eyebrow">Autoevaluación académica mediada</span><h1>Lo que ya haces.<br><span class="highlight">Lo que puedes potenciar.</span></h1><p>Revisa cómo va tu semestre, reconoce tus estrategias y descubre oportunidades para fortalecer o potenciar tu aprendizaje.</p><div class="actions">${btn('Comenzar →','start','green')}</div></div></section><section class="screen" style="margin-top:18px;min-height:auto"><span class="pill">Modalidad</span><div class="modebox"><button class="${st.mode==='individual'?'selected':''}" data-mode="individual"><b>👤 Tutoría individual</b><small>Reflexión con tu tutor/a.</small></button><button class="${st.mode==='grupal'?'selected':''}" data-mode="grupal"><b>👥 Tutoría grupal</b><small>Cada estudiante responde y conversa sin compartir datos personales.</small></button></div><p class="footnote">Prototipo local. No registra ni envía información académica a servidores.</p></section>`;return}
let names=['Mi semestre','Una decisión','Mis estrategias','Cartas','Mi mapa'];let aside=`<aside class="side"><span class="pill">EN RUTA · 2026</span><h3>Mi recorrido</h3>${names.map((x,i)=>`<div class="stepitem ${st.step===i?'active':''}"><i>${i+1}</i>${x}</div>`).join('')}<div class="mini">El puntaje representa respuestas de autoevaluación, no un diagnóstico. El tutor ayuda a interpretarlas.</div></aside>`;let h=`<div class="step-pills">${names.map((x,i)=>`<span class="${st.step===i?'current':''}">${i+1}. ${x}</span>`).join('')}</div>`;
if(st.step===0){h+=`<span class="pill">Tu experiencia universitaria</span><h2>¿Cómo va tu semestre?</h2><p class="lead">Partamos de lo que está ocurriendo en tus asignaturas. Puedes omitir información que no quieras compartir.</p>`;
h+=choices('rendimiento','En general, ¿cómo evalúas tu rendimiento en tus asignaturas?',[['bien','Me está yendo bien'],['mixto','Tengo resultados diferentes'],['dificil','Me ha resultado difícil'],['sin','Todavía no tengo claridad']]);
h+=input('dificil','¿Qué asignatura te está resultando más desafiante? (opcional)','Nombre de la asignatura');
h+=choices('motivo','¿Qué explica principalmente ese desafío, según tu experiencia?',[['comprender','Comprender lo que se trabaja'],['aplicar','Aplicar conceptos y resolver actividades'],['organizar','Organizar tiempos y entregas'],['comunicar','Expresar mis ideas'],['condiciones','Condiciones externas a la asignatura'],['varios','Se relacionan varios factores']]);
h+=choices('notas','¿Cómo han sido tus notas o evaluaciones hasta ahora?',[['satisfactorias','En general, satisfactorias'],['variables','Muy distintas entre asignaturas'],['bajas','Más bajas de lo esperado'],['pendientes','Aún no tengo resultados'],['reserva','Prefiero no responder']]);
h+=choices('reprobacion','¿Has reprobado alguna asignatura universitaria?',[['no','No'],['si','Sí'],['pendiente','Es mi primer periodo / todavía no sé'],['prefiero','Prefiero no responder']]);
h+=choices('dominio','Si la asignatura desafiante es matemática o física, ¿cuál corresponde?',[['matematica','Matemática'],['fisica','Física'],['otra','Otra / no corresponde']]);
h+=`<div class="tutor-tip"><b>Para conversar:</b> ¿Cuál evaluación o actividad concreta ayuda a comprender lo que estás señalando? ¿Qué decisiones tomaste y qué condiciones influyeron? No interpreten una nota sin conocer la tarea.</div><div class="actions">${btn('Continuar →','next','green')}</div>`}
if(st.step===1){h+=`<span class="pill">Decisión situada</span><h2>${CASE.tag}</h2><div class="question"><span class="eyebrow">Primero, conversemos</span><div class="big">${CASE.q}</div><p>El tutor invita a justificar distintas decisiones, antes de mostrar las alternativas.</p></div>`;
if(!st.showOptions)h+=`<div class="actions">${btn('Mostrar alternativas →','options','green')}</div>`;
else{h+=`<div class="option-grid">${CASE.opts.map((o,i)=>`<button type="button" class="option ${st.chosen===i?'sel':''}" data-option="${i}"><span class="letter">${'ABCD'[i]}</span><strong>${o.t}</strong></button>`).join('')}</div>`;if(st.chosen!==null)h+=`<div class="review"><span class="resulttag">Una decisión, diferentes estrategias</span><h3>Para pensar</h3><p>${CASE.opts[st.chosen].fb}</p><div class="tutor-tip">¿En qué situación universitaria has tomado una decisión similar? ¿Qué cambiarías ahora?</div></div><div class="actions">${btn('Continuar →','next','green')}</div>`;}}
if(st.step===2){let n=ITEMS.filter(it=>score(it)!==null).length;h+=`<span class="pill">Lista de cotejo</span><h2>Mis estrategias para aprender</h2><p class="lead">Para cada afirmación, indica con qué frecuencia la pones en práctica y qué seguridad sientes al hacerlo. Piensa en experiencias reales, no en la respuesta que suena mejor.</p><div class="insight"><b>${n} de ${ITEMS.length} prácticas evaluadas</b><p class="footnote">Puedes indicar que aún no has tenido oportunidad de utilizar una práctica: no sumará ni restará puntos.</p></div>`;let last='';for(const it of ITEMS){let a=st.answers[it.id]||{};let group=GROUPS.find(x=>x.id===it.group).label;if(group!==last){last=group;h+=`<h3 class="check-group">${group}</h3>`}h+=`<div class="check-row"><strong>${it.t}</strong><div class="security"><span class="footnote" style="width:100%">¿Con qué frecuencia?</span>${[['habitual','En varias tareas'],['aveces','En algunas tareas'],['nunca','Todavía no'],['sin','No he tenido ocasión']].map(([v,t])=>`<button type="button" class="${a.freq===v?'on':''}" data-freq="${it.id}" data-val="${v}">${t}</button>`).join('')}</div>${a.freq&&a.freq!=='sin'&&a.freq!=='nunca'?`<div class="security"><span class="footnote" style="width:100%">¿Con qué seguridad?</span>${[['baja','Necesito orientación'],['media','Depende de la tarea'],['alta','Con seguridad']].map(([v,t])=>`<button type="button" class="${a.conf===v?'on':''}" data-conf="${it.id}" data-val="${v}">${t}</button>`).join('')}</div>`:''}</div>`}h+=`<div class="tutor-tip">Contrasten una respuesta alta y otra baja con ejemplos de asignaturas concretas. ¿Qué condiciones explican esa diferencia?</div><div class="actions">${btn('Continuar a las cartas →','next','green')}</div>`}
if(st.step===3){h+=`<span class="pill">Dinámica de conversación</span><h2>Cartas para mirar más lejos</h2><p class="lead">Elijan una carta para ampliar la reflexión. La consigna se conversa oralmente, sin escribir otra respuesta.</p>`;if(st.card===null)h+=`<div class="deck-zone ${st.shuffling?'shuffling':''}" id="deck"><div class="stack-card">✳</div><div class="stack-card">✦</div><div class="stack-card">?</div></div><div class="actions">${btn('Mezclar cartas','shuffle','green')}${btn('Continuar sin carta →','next','secondary')}</div>`;else{let c=CARDS[st.card];h+=`<div class="flip-wrap ${st.flipped?'flipped':''}" data-flip="true" role="button" tabindex="0" aria-label="Voltear carta"><div class="flip-core"><div class="flip-face flip-front"><span class="eyebrow">Carta elegida</span><h3>${c.title}</h3><p>Toca para descubrir</p></div><div class="flip-face flip-back"><span class="eyebrow">Conversemos</span><p style="font-weight:750;font-size:18px">${c.q}</p></div></div></div><div class="card-followup ${st.flipped?'':'hidden'}"><div class="insight"><b>Para profundizar</b><p>${c.prompt}</p></div><div class="actions">${btn('Otra carta','again','secondary')}${btn('Continuar →','next','green')}</div></div><div class="card-instruction ${st.flipped?'hidden':''}" style="text-align:center">Toca la carta y conversa con tu tutor/a.</div><div class="actions">${btn('Continuar sin voltear →','next','secondary')}</div>`}}
if(st.step===4){let ss=summary(),gs=scores();let strongest=gs.filter(x=>x.pct!==null).sort((a,b)=>b.pct-a.pct)[0],lowest=gs.filter(x=>x.pct!==null).sort((a,b)=>a.pct-b.pct)[0];h+=`<span class="pill">Retroalimentación personalizada</span><h2>Mi mapa de oportunidades</h2><p class="lead">Tu puntaje resume la frecuencia y seguridad que declaraste al utilizar algunas estrategias. Interprétalo junto con tus notas, asignaturas y experiencias, sin convertirlo en una etiqueta.</p><div class="score-banner"><span>Puntaje de autoevaluación</span><strong>${ss.n?`${ss.total} / ${ss.max}`:'—'}</strong><small>${ss.n?`${ss.pct}% del puntaje posible en las prácticas que respondiste`:'Responde las prácticas para obtener un puntaje'}</small></div>${graphs()}`;
h+=`<div class="review"><h3>¿Qué nos dicen tus respuestas?</h3><p>${strongest?`<b>Para potenciar:</b> ${strongest.label.toLowerCase()} aparece entre los ámbitos que valoraste con más seguridad. ¿En qué desafío nuevo podrías utilizar esas estrategias?`:'Aún no hay suficiente información para identificar un ámbito destacado.'}</p><p>${lowest?`<b>Para fortalecer:</b> ${lowest.label.toLowerCase()} merece una conversación más profunda. ¿Qué actividades y decisiones ayudan a explicar tus respuestas?`:'Puedes explorar nuevas estrategias incluso si actualmente te va bien.'}</p><p>${st.context.rendimiento==='bien'?'Reconoces un rendimiento favorable: eso también abre oportunidades de profundización.':st.context.rendimiento==='dificil'||st.context.notas==='bajas'?'Si tus resultados han sido difíciles, no los interpretaremos como una falta de capacidad. Revisemos qué estrategias y condiciones influyen.':'Las diferencias entre asignaturas ayudan a identificar dónde ya cuentas con recursos y dónde puedes ampliar tus estrategias.'}</p>${st.context.reprobacion==='si'?'<p>Señalaste que has reprobado alguna asignatura. Conviene conversar qué ocurrió y qué sería útil hacer ahora; ese antecedente no determina automáticamente ningún servicio.</p>':''}</div>`;
h+=choices('interes','¿Qué te gustaría priorizar o potenciar ahora?',[['lectura','Lectura'],['escritura','Escritura'],['oral','Comunicación oral'],['estudio','Estrategias de estudio'],['motivacion','Motivación académica'],['psico','Conocer mejor cómo aprendo'],['ninguno','Por ahora, ninguno']]);
h+=`<h3 style="font:850 23px Outfit;margin:22px 0 8px">Apoyos que podrías explorar</h3><p class="footnote">Estas sugerencias consideran tu autoevaluación, tus asignaturas y tu interés. Son oportunidades, no diagnósticos ni derivaciones obligatorias.</p>${recommendations().map(x=>`<div class="service"><div><b>${SERV[x.id]}</b><small>${x.why}</small></div><a href="${BOOK[x.id]}" target="_blank" rel="noopener noreferrer">Agendar ↗</a></div>`).join('')}<div class="note"><b>Tu decisión importa:</b> puedes reservar ahora en Bookings, guardar un enlace, seguir conversando con tu tutor/a o consultar por otros apoyos de la UAH. No es necesario solicitar ayuda para aprovechar esta reflexión.</div><div class="actions">${btn('Volver al inicio','restart','secondary')}</div>`}
root.innerHTML=`<div class="main">${aside}<section class="screen">${h}</section></div>`;
}
let timer;root.addEventListener('click',ev=>{let el=ev.target.closest('button,[data-flip]');if(!el)return;if(el.dataset.mode){st.mode=el.dataset.mode;render();return}if(el.dataset.context){st.context[el.dataset.context]=el.dataset.value;const y=window.scrollY;render();window.scrollTo(0,y);return}if(el.hasAttribute('data-option')){st.chosen=Number(el.dataset.option);const y=window.scrollY;render();window.scrollTo(0,y);return}if(el.dataset.freq){let id=el.dataset.freq,v=el.dataset.val;st.answers[id]={freq:v,conf:['nunca','sin'].includes(v)?null:st.answers[id]?.conf||null};const y=window.scrollY;render();window.scrollTo(0,y);return}if(el.dataset.conf){let id=el.dataset.conf;st.answers[id].conf=el.dataset.val;const y=window.scrollY;render();window.scrollTo(0,y);return}if(el.hasAttribute('data-flip')){st.flipped=!st.flipped;root.querySelector('.flip-wrap')?.classList.toggle('flipped',st.flipped);root.querySelector('.card-followup')?.classList.toggle('hidden',!st.flipped);root.querySelector('.card-instruction')?.classList.toggle('hidden',st.flipped);return}let a=el.dataset.act;if(!a)return;if(a.startsWith('view-')){st.view=a.slice(5);const y=window.scrollY;render();window.scrollTo(0,y);return}if(a==='options')st.showOptions=true;if(a==='start')st.step=0;if(a==='next'){st.step=Math.min(st.step+1,4);st.showOptions=false}if(a==='restart')Object.assign(st,{step:-1,showOptions:false,chosen:null,answers:{},context:{rendimiento:'',dificil:'',motivo:'',notas:'',reprobacion:'prefiero',dominio:'',interes:''},card:null,flipped:false,view:'bars'});if(a==='again'){st.card=null;st.flipped=false}if(a==='shuffle'){if(st.shuffling)return;st.shuffling=true;root.querySelector('#deck')?.classList.add('shuffling');el.disabled=true;timer=setTimeout(()=>{st.shuffling=false;st.card=Math.floor(Math.random()*CARDS.length);render()},1290);return}render()});
root.addEventListener('input',ev=>{let el=ev.target;if(el.dataset.text)st.context[el.dataset.text]=el.value});root.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-flip]')){ev.preventDefault();ev.target.click()}});render();
</script></body></html>
